name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test (includes the GLSL check)
        run: npm test -- --run

      - name: API reference (every public type exported and linked)
        run: npm run docs:api -- --emit none --treatWarningsAsErrors

      - name: Build
        run: npm run build

      - name: Verify bundles
        run: node scripts/check-dist.mjs
